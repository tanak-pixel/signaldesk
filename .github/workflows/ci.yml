name: SignalDesk CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check Docker
        run: docker info

      - name: Restore dependencies
        run: >
          dotnet restore
          backend/SignalDesk.Api.Tests/SignalDesk.Api.Tests.csproj

      - name: Build API and tests
        run: >
          dotnet build
          backend/SignalDesk.Api.Tests/SignalDesk.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run API tests
        run: >
          dotnet test
          backend/SignalDesk.Api.Tests/SignalDesk.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and build
        run: npm run build