services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_DB: signaldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - signaldesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signaldesk_data:
